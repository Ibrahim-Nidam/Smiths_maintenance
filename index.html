<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function() {
      const t = localStorage.getItem('smiths_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <title>Sign in - Maintenance</title>
</head>
<body class="auth-body">
  <div class="auth-card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px;">
      <div class="brand" style="margin-bottom: 0;"><span class="brand-mark"></span>Maintenance</div>
      <button id="theme-toggle-btn" class="theme-toggle-btn" type="button"></button>
    </div>
    <h1 class="auth-title">Sign in</h1>
    <form id="login-form" novalidate>
      <div class="field">
        <label class="label" for="email">Email</label>
        <input class="input" id="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label class="label" for="password">Password</label>
        <input class="input" id="password" type="password" autocomplete="current-password" required>
      </div>
      <p id="error" class="error-text" role="alert"></p>
      <button id="login" class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
  </div>
  <script type="module">
    import { signIn, getSession, getProfile } from './js/auth.js';
    import { initThemeToggle } from './js/components/theme-toggle.js';

    initThemeToggle('theme-toggle-btn');

    const form = document.getElementById('login-form');
    const btn = document.getElementById('login');
    const err = document.getElementById('error');
    const authMessage = sessionStorage.getItem('smiths_auth_message');
    if (authMessage) {
      err.textContent = authMessage;
      sessionStorage.removeItem('smiths_auth_message');
    }

    const session = await getSession();
    if (session) {
      const profile = await getProfile().catch(() => null);
      if (profile?.active) {
        window.location.replace('app.html');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      btn.disabled = true;
      try {
        await signIn(form.email.value.trim(), form.password.value);
        window.location.replace('app.html');
      } catch (ex) {
        err.textContent = ex.message || 'Could not sign in. Check your email and password.';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
