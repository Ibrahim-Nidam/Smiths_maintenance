<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function() {
      const t = localStorage.getItem('smiths_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <title>Maintenance</title>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/dashboard"><span class="brand-mark"></span>Maintenance</a>
      <nav id="nav" class="nav" aria-label="Main"></nav>
      <div class="topbar-right">
        <button id="theme-toggle-btn" class="theme-toggle-btn" type="button"></button>
        <button id="user-profile-btn" class="user-btn" type="button" title="Edit your profile">
          <span id="user-name" class="user-name"></span>
          <span id="user-role" class="user-role"></span>
        </button>
        <button id="logout" class="btn btn-ghost btn-sm" type="button">Sign out</button>
        <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main id="view" class="page"></main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
